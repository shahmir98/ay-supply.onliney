<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A&Y Supply with Rain Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Roboto', sans-serif;
    background-color: #e0f7fa; /* Light pastel blue */
    color: #333;
    line-height: 1.6;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
  }

  h1, h2 {
    color: #2b6cb0;
    margin-bottom: 20px;
    font-family: 'Montserrat', sans-serif;
  }

  p {
    font-size: 1.1em;
    margin-bottom: 30px;
  }

  .icons {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 40px;
  }

  .icon {
    font-size: 3rem;
    transition: transform 0.3s;
  }

  .icon:hover {
    transform: scale(1.1);
  }

  section {
    padding: 60px 20px;
    background: #ffffff; /* Keep section background white for contrast */
    margin: 40px 0;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    animation: fadeIn 1s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .team {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-top: 20px;
  }

  .team-member {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .team-member:hover {
    transform: translateY(-10px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .team-img {
    width: 100%;
    height: 250px;
    object-fit: contain;
    background-color: white;
    margin: 0 auto 10px auto;
    display: block;
    border-radius: 8px;
  }

  .team-title {
    font-weight: 600;
    font-size: 1.1rem;
    margin-top: 5px;
    color: #2b6cb0;
  }

  .contact-info {
    font-size: 1.2rem;
    background-color: #e6f0ff;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
    animation: pulse 1.5s infinite;
    margin-bottom: 20px;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }

  .social-icons a {
    font-size: 2.5rem;
    color: #3b5998;
    transition: transform 0.3s;
  }

  .social-icons a:hover {
    transform: scale(1.2);
  }

  .whatsapp-icon {
    font-size: 2.5rem;
    color: #25D366;
    transition: transform 0.3s;
    margin-right: 10px;
  }

  .whatsapp-icon:hover {
    transform: scale(1.2);
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  @media (max-width: 500px) {
    .icon { font-size: 2rem; }
    .team-img {
      width: 100%;
      height: auto;
    }

    .logo {
      width: 80px;
    }
  }
</style>

</head>
<body>

  <!-- Rain Animation -->
  <div class="rain"></div>
  <div class="container">
    <h1>Welcome to A&Y Supply</h1>
    <p>We supply your everyday essentials – from stationery to food.<br>Stay tuned for something amazing!</p>
  </div>

  <!-- Team Section -->
  <section id="team" class="container">
    <h2>Meet Our Team</h2>
    <div class="team">
      <div class="team-member">
        <img src="images/yusrie.jpg" alt="Mohd Yusrie" class="team-img" />
        <div class="team-title">Founder</div>
        <p>Mohd Yusrie</p>
      </div>
      <!-- Add other team members here -->
    </div>
  </section>

  <script>
    // Add rain drops
    function createRain() {
      const rainContainer = document.querySelector('body');
      for (let i = 0; i < 100; i++) {
        const raindrop = document.createElement('div');
        raindrop.classList.add('raindrop');
        raindrop.style.left = Math.random() * 100 + 'vw';
        raindrop.style.animationDuration = Math.random() * 1 + 0.5 + 's';
        raindrop.style.animationDelay = Math.random() * 2 + 's';
        rainContainer.appendChild(raindrop);
      }
    }

    createRain();
  </script>

</body>
</html>
