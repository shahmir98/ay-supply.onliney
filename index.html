<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A&Y Supply with Rain Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #e0f7fa;
      color: #333;
      line-height: 1.6;
      overflow: hidden;
      position: relative;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    h1, h2 {
      color: #2b6cb0;
      margin-bottom: 20px;
      font-family: 'Montserrat', sans-serif;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    /* Rain Animation */
    .raindrop {
      position: absolute;
      top: -20px;
      width: 2px;
      height: 10px;
      background: rgba(0, 0, 255, 0.6);
      animation: fall linear infinite;
    }

    /* Create multiple raindrops with random animations */
    @keyframes fall {
      0% {
        top: -20px;
      }
      100% {
        top: 100%;
      }
    }

    /* Randomize the number and position of raindrops */
    .raindrop:nth-child(odd) {
      animation-duration: 0.6s;
      animation-delay: -0.3s;
    }

    .raindrop:nth-child(even) {
      animation-duration: 1.2s;
      animation-delay: 0s;
    }

    /* Styling for team section */
    section {
      padding: 60px 20px;
      background: #ffffff;
      margin: 40px 0;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    .team {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }

    .team-member {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
    }

    .team-img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background-color: white;
      margin: 0 auto 10px auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Rain Animation -->
  <div class="rain"></div>
  <div class="container">
    <h1>Welcome to A&Y Supply</h1>
    <p>We supply your everyday essentials – from stationery to food.<br>Stay tuned for something amazing!</p>
  </div>

  <!-- Team Section -->
  <section id="team" class="container">
    <h2>Meet Our Team</h2>
    <div class="team">
      <div class="team-member">
        <img src="images/yusrie.jpg" alt="Mohd Yusrie" class="team-img" />
        <div class="team-title">Founder</div>
        <p>Mohd Yusrie</p>
      </div>
      <!-- Add other team members here -->
    </div>
  </section>

  <script>
    // Add rain drops
    function createRain() {
      const rainContainer = document.querySelector('body');
      for (let i = 0; i < 100; i++) {
        const raindrop = document.createElement('div');
        raindrop.classList.add('raindrop');
        raindrop.style.left = Math.random() * 100 + 'vw';
        raindrop.style.animationDuration = Math.random() * 1 + 0.5 + 's';
        raindrop.style.animationDelay = Math.random() * 2 + 's';
        rainContainer.appendChild(raindrop);
      }
    }

    createRain();
  </script>

</body>
</html>
